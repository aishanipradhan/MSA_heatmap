            var metricKey = (metric === "gas")
                ? `${timeframe}__gas_${gasType}`
                : `${timeframe}__${metric}`;

            removeAll(metricMap);
            removeAll(hexMap);
            removeAll(visitedMap);

            var visitedToggle = document.getElementById("toggle-visited");
            if (visitedToggle && visitedToggle.checked && visitedMap[timeframe]) {
                map.addLayer(visitedMap[timeframe]);
            }

            if (metricMap[metricKey]) {
                map.addLayer(metricMap[metricKey]);
            }

            if (hexMap[timeframe]) {
                map.addLayer(hexMap[timeframe]);
            }

            updateGasPanelVisibility();
            updateInfoBox(timeframe);
        }

        document.querySelectorAll('input[name="metric"]').forEach(function(el) {
            el.addEventListener("change", updateLayers);
        });

        document.querySelectorAll('input[name="timeframe"]').forEach(function(el) {

        });

        document.querySelectorAll('input[name="gas_type"]').forEach(function(el) {
            el.addEventListener("change", updateLayers);
        });

        var visitedToggle = document.getElementById("toggle-visited");
        if (visitedToggle) {
            visitedToggle.addEventListener("change", updateLayers);
        }

        updateGasPanelVisibility();
        updateLayers();
    });

    return div

        </tr>`).join(''))

    div.innerHTML=table;
    
    return div
    }

    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["h3_cell", "n_sessions_visited", "n_location_pings"];
    let aliases = ["H3 Cell:", "Visited sessions:", "Location pings:"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }

    let handleObject = feature => {

            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["h3_cell", "n_sessions_w_alarms", "n_alarm_days", "n_gas_alarms", "n_emg_alarms", "alarm_types", "n_gas_co", "n_gas_h2s", "n_gas_o2", "n_gas_comb", "gas_types_present", "n_sessions_visited", "n_location_pings"];

    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
